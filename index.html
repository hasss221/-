<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملتقى دجلة والفرات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
        }

        header {
            background: #075e54;
            color: white;
            text-align: center;
            padding: 25px 10px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        header p {
            margin: 0;
        }

        nav {
            background: #064c44;
            text-align: center;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 15px;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px #00000012;
        }

        .welcome h2 {
            color: #075e54;
        }

        .section {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        .button {
            display: inline-block;
            background: #075e54;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
        }

        footer {
            background: #064c44;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 35px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 23px;
            }

            nav a {
                display: inline-block;
                margin: 7px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ملتقى دجلة والفرات</h1>
        <p>ملتقاكم العراقي للدردشة والتواصل</p>
    </header>

    <nav>
        <a href="#home">الرئيسية</a>
        <a href="#about">عن الملتقى</a>
        <a href="#contact">تواصل معنا</a>
    </nav>
