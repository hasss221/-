<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملتقى دجلة والفرات</title>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f1f5f2;
      color: #26352c;
      text-align: center;
    }

    header {
      background: #176b45;
      color: white;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      font-size: 17px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px 15px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px #cccccc;
    }

    h2 {
      color: #176b45;
    }

    p {
      font-size: 17px;
      line-height: 1.9;
    }

    .welcome {
      background: #dff3e5;
      padding: 12px;
      border-radius: 10px;
      color: #176b45;
      font-weight: bold;
    }

    footer {
      padding: 20px;
      color: #555555;
    }
  </style>
</head>

<body>

  <header>
    <h1>ملتقى دجلة والفرات</h1>
    <p>ملتقاكم العراقي للتواصل والدردشة</p>
  </header>

  <main>
    <div class="welcome">أهلاً وسهلاً بكم</div>

    <h2>مرحباً بكم في ملتقى دجلة والفرات</h2>

    <p>
      هذا ملتقاكم للتعارف والتواصل وتبادل الآراء.
      نسعى إلى إنشاء مجتمع عراقي يجمعنا بالمحبة والاحترام.
    </p>

    <p>
      قريباً سنضيف المزيد من الميزات إلى موقعنا.
    </p>
  </main>

  <footer>
    © ملتقى دجلة والفرات
  </footer>

</body>
</html>
